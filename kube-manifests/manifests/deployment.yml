apiVersion : apps/v1
kind: Deployment
metadata:
  name: app1nginxaks 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1nginxaks
  template:
    metadata:
      labels:
        app: app1nginxaks 
    spec:
      containers:
        - name: app1nginxaks 
          image: myaksdevopacr.azurecr.io/custom2aksnginxapp1  #using the wizard to configure pipeline image name pass will overide this one
          ports:
          - containerPort: 80